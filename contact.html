<style>
:root{
--primary:#2563EB;
--dark:#0F172A;
--light:#F8FAFC;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#e0e7ff,#ffffff);
min-height:100vh;
display:flex;
flex-direction:column;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 40px;
background:var(--primary);
color:white;
}

header a{
color:white;
text-decoration:none;
font-weight:bold;
}

.container{
max-width:1100px;
margin:60px auto;
background:white;
padding:40px;
border-radius:15px;
box-shadow:0 20px 40px rgba(0,0,0,0.1);
text-align:center;
}

h1{
margin-bottom:40px;
}

/* GRID */
.contact-icons{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:25px;
}

/* CARD */
.contact-card{
background:#f8fafc;
padding:30px 20px;
border-radius:15px;
transition:0.3s;
cursor:pointer;
text-decoration:none;
color:#1E293B;
box-shadow:0 8px 20px rgba(0,0,0,0.05);
}

.contact-card:hover{
transform:translateY(-6px);
box-shadow:0 15px 30px rgba(0,0,0,0.1);
}

.contact-card i{
font-size:42px;
margin-bottom:15px;
color:var(--primary);
}

.contact-card h3{
margin-bottom:5px;
}

footer{
text-align:center;
padding:20px;
margin-top:auto;
color:#555;
}
</style>
</head>
